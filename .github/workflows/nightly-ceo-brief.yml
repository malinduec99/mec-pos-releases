name: MEC POS 24/7 Nightly Financial Brief Cron

on:
  schedule:
    # 23:30 (11:30 PM) Sri Lanka Time is UTC 18:00 (Every Day)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

jobs:
  run-nightly-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install firebase

      - name: Execute Daily Financial Closing & WhatsApp Brief
        run: node scripts/nightly-report-cron.js
